<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Srijan Motion Studio — AI Video Generator</title>
  <style>
    :root {
      --bg: #090d16;
      --surface: #111827;
      --surface-2: #1e293b;
      --border: #283548;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --accent: #818cf8;
      --text: #f8fafc;
      --muted: #94a3b8;
      --success: #10b981;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    
    body {
      background: radial-gradient(circle at top right, #131c31, var(--bg) 60%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Navbar */
    header {
      border-bottom: 1px solid var(--border);
      background: rgba(17, 24, 39, 0.8);
      backdrop-filter: blur(12px);
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.15rem; letter-spacing: -0.02em; }
    .brand span { background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    .token-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 99px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .token-pill:hover { border-color: var(--primary); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); }
    .dot.connected { background: var(--success); box-shadow: 0 0 8px var(--success); }

    /* Token Drawer */
    .settings-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: none;
    }
    .settings-bar.open { display: block; }
    .settings-grid {
      max-width: 1120px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 12px;
      align-items: end;
    }

    /* Main Workspace */
    main {
      max-width: 1120px;
      width: 100%;
      margin: 24px auto;
      padding: 0 16px;
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 24px;
      flex: 1;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
      display: flex;
      flex-direction: column;
    }

    /* Tabs */
    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--bg);
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--border);
      margin-bottom: 18px;
    }
    .tab-btn {
      padding: 10px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-weight: 600;
      font-size: 0.9rem;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }
    .tab-btn.active {
      background: var(--surface-2);
      color: var(--primary);
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    label { display: block; font-size: 0.82rem; font-weight: 500; color: var(--muted); margin-bottom: 6px; }
    input[type="text"], input[type="password"], textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 11px 14px;
      border-radius: 10px;
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, textarea:focus { border-color: var(--primary); }
    textarea { resize: vertical; min-height: 92px; line-height: 1.45; }

    /* Dropzone */
    .dropzone {
      border: 1.5px dashed var(--border);
      background: var(--bg);
      border-radius: 12px;
      padding: 18px;
      text-align: center;
      cursor: pointer;
      margin-bottom: 16px;
      transition: 0.2s;
      position: relative;
    }
    .dropzone:hover { border-color: var(--primary); background: rgba(56, 189, 248, 0.04); }
    .dropzone input { display: none; }
    .dropzone p { font-size: 0.88rem; color: var(--muted); }
    .dropzone img { max-height: 180px; border-radius: 8px; margin-top: 8px; display: none; margin-inline: auto; }

    /* Saved Prompts Vault */
    .prompt-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .save-prompt-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--primary);
      font-size: 0.76rem;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
    }
    .save-prompt-btn:hover { background: rgba(56, 189, 248, 0.1); }

    .saved-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }
    .chip {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.78rem;
      padding: 5px 10px;
      border-radius: 99px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      max-width: 100%;
    }
    .chip:hover { border-color: var(--primary); }
    .chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 180px; }
    .chip i { font-style: normal; color: var(--muted); font-weight: bold; padding: 0 2px; }
    .chip i:hover { color: var(--danger); }

    /* Primary Action Button */
    .btn-primary {
      width: 100%;
      margin-top: 18px;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--primary), var(--primary-hover));
      color: #04101d;
      font-weight: 700;
      font-size: 0.98rem;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.2s;
    }
    .btn-primary:hover { opacity: 0.95; }
    .btn-primary:active { transform: scale(0.99); }
    .btn-primary:disabled { background: var(--surface-2); color: var(--muted); cursor: not-allowed; }

    .btn-sm {
      padding: 10px 16px;
      border-radius: 10px;
      border: none;
      background: var(--primary);
      color: #04101d;
      font-weight: 600;
      cursor: pointer;
    }

    /* Output Stage */
    .stage-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .stage-title { font-size: 0.95rem; font-weight: 600; color: var(--text); }
    
    .video-stage {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      min-height: 310px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .video-stage video { width: 100%; max-height: 380px; border-radius: 8px; display: none; }
    .placeholder-state { color: var(--muted); font-size: 0.88rem; max-width: 260px; line-height: 1.5; }

    .loader {
      width: 36px; height: 36px;
      border: 3px solid var(--surface-2);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin: 0 auto 12px;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .status-text { font-size: 0.85rem; color: var(--primary); margin-top: 8px; }
    .status-text.error { color: var(--danger); }

    .stage-actions {
      display: none;
      gap: 10px;
      margin-top: 14px;
    }
    .btn-download {
      flex: 1;
      text-align: center;
      background: var(--success);
      color: #031f14;
      text-decoration: none;
      padding: 11px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.9rem;
    }

    @media (max-width: 820px) {
      main { grid-template-columns: 1fr; }
      .settings-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">✦ <span>Srijan Motion Studio</span></div>
    <div class="token-pill" id="toggleSettingsBtn">
      <span class="dot" id="tokenDot"></span>
      <span id="tokenStatusLabel">Add HF Token</span>
    </div>
  </header>

  <!-- Collapsible Token & Engine Config -->
  <div class="settings-bar" id="settingsBar">
    <div class="settings-grid">
      <div>
        <label>Your Hugging Face API Token (Stored Locally in Browser)</label>
        <input type="password" id="hfToken" placeholder="hf_xxxxxxxxxxxxxxxxxxxxxxxxx" />
      </div>
      <div>
        <label>ZeroGPU Space Engine</label>
        <input type="text" id="spaceId" value="Lightricks/ltx-video-distilled" />
      </div>
      <button class="btn-sm" id="saveConfigBtn">Save & Close</button>
    </div>
  </div>

  <main>
    <!-- Left Panel: Controls -->
    <section class="panel">
      <div class="tabs">
        <button class="tab-btn active" data-mode="i2v">🖼️ Image to Video</button>
        <button class="tab-btn" data-mode="t2v">✍️ Text to Video</button>
      </div>

      <!-- Image Upload (Only visible in i2v mode) -->
      <div id="imageSection">
        <label>Source Image</label>
        <div class="dropzone" id="dropzone">
          <input type="file" id="imageInput" accept="image/*" />
          <p id="dropText">Click to upload or drop an image here</p>
          <img id="imgPreview" alt="Uploaded preview" />
        </div>
      </div>

      <!-- Prompt + Saved Vault -->
      <div>
        <div class="prompt-header">
          <label style="margin:0;">Motion / Scene Prompt</label>
          <button class="save-prompt-btn" id="savePromptBtn">+ Save Prompt</button>
        </div>
        <textarea id="promptInput" placeholder="Describe camera movement, expressions, or scene action..."></textarea>

        <div class="saved-chips" id="savedChipsContainer"></div>
      </div>

      <button class="btn-primary" id="generateBtn">Generate Video</button>
    </section>

    <!-- Right Panel: Video Showcase -->
    <section class="panel">
      <div class="stage-header">
        <div class="stage-title">Output Preview</div>
        <span id="modeBadge" style="font-size:0.75rem; color:var(--muted); background:var(--bg); padding:4px 10px; border-radius:99px; border:1px solid var(--border);">Image-to-Video</span>
      </div>

      <div class="video-stage">
        <div class="loader" id="loader"></div>
        <div class="placeholder-state" id="placeholderState">
          Your generated MP4 video will appear here. Save your favorite prompts on the left for one-click creation.
        </div>
        <video id="outputVideo" controls autoplay loop playsinline></video>
        <div class="status-text" id="statusText"></div>
      </div>

      <div class="stage-actions" id="stageActions">
        <a id="downloadLink" class="btn-download" download="srijan-ai-video.mp4">⬇️ Download MP4 Video</a>
      </div>
    </section>
  </main>

  <script type="module">
    import { Client } from "https://cdn.jsdelivr.net/npm/@gradio/client/dist/index.min.js";

    // State & Elements
    let currentMode = "i2v";
    const tokenInput = document.getElementById("hfToken");
    const spaceInput = document.getElementById("spaceId");
    const settingsBar = document.getElementById("settingsBar");
    const toggleSettingsBtn = document.getElementById("toggleSettingsBtn");
    const saveConfigBtn = document.getElementById("saveConfigBtn");
    const tokenDot = document.getElementById("tokenDot");
    const tokenStatusLabel = document.getElementById("tokenStatusLabel");

    const tabBtns = document.querySelectorAll(".tab-btn");
    const imageSection = document.getElementById("imageSection");
    const modeBadge = document.getElementById("modeBadge");
    const dropzone = document.getElementById("dropzone");
    const imageInput = document.getElementById("imageInput");
    const imgPreview = document.getElementById("imgPreview");
    const dropText = document.getElementById("dropText");

    const promptInput = document.getElementById("promptInput");
    const savePromptBtn = document.getElementById("savePromptBtn");
    const savedChipsContainer = document.getElementById("savedChipsContainer");

    const generateBtn = document.getElementById("generateBtn");
    const loader = document.getElementById("loader");
    const placeholderState = document.getElementById("placeholderState");
    const statusText = document.getElementById("statusText");
    const outputVideo = document.getElementById("outputVideo");
    const stageActions = document.getElementById("stageActions");
    const downloadLink = document.getElementById("downloadLink");

    // Default starter prompts
    const DEFAULT_PROMPTS = [
      "Gentle natural smile, subtle head nod, soft cinematic lighting",
      "Slow cinematic zoom in, soft morning sunbeams, gentle breeze",
      "Cheerful laughing animation, expressive movement, vibrant energy"
    ];

    // Load Local Storage
    tokenInput.value = localStorage.getItem("srijan_hf_token") || "";
    spaceInput.value = localStorage.getItem("srijan_hf_space") || "Lightricks/ltx-video-distilled";
    promptInput.value = localStorage.getItem("srijan_last_prompt") || DEFAULT_PROMPTS[0];

    function updateTokenUI() {
      const hasToken = tokenInput.value.trim().startsWith("hf_");
      tokenDot.classList.toggle("connected", hasToken);
      tokenStatusLabel.textContent = hasToken ? "HF Token Saved" : "Add HF Token";
      if (!hasToken) settingsBar.classList.add("open");
    }
    updateTokenUI();

    toggleSettingsBtn.addEventListener("click", () => settingsBar.classList.toggle("open"));
    saveConfigBtn.addEventListener("click", () => {
      localStorage.setItem("srijan_hf_token", tokenInput.value.trim());
      localStorage.setItem("srijan_hf_space", spaceInput.value.trim() || "Lightricks/ltx-video-distilled");
      updateTokenUI();
      settingsBar.classList.remove("open");
    });

    // Save last edited prompt automatically
    promptInput.addEventListener("input", () => {
      localStorage.setItem("srijan_last_prompt", promptInput.value);
    });

    // Saved Prompts Vault Logic
    function getSavedPrompts() {
      const raw = localStorage.getItem("srijan_saved_prompts");
      return raw ? JSON.parse(raw) : DEFAULT_PROMPTS;
    }

    function renderSavedPrompts() {
      const list = getSavedPrompts();
      savedChipsContainer.innerHTML = "";
      list.forEach((text, idx) => {
        const chip = document.createElement("div");
        chip.className = "chip";
        chip.title = text;
        chip.innerHTML = `<span>${text}</span><i data-idx="${idx}" title="Remove">×</i>`;
        
        chip.addEventListener("click", (e) => {
          if (e.target.tagName === "I") {
            const updated = getSavedPrompts().filter((_, i) => i !== idx);
            localStorage.setItem("srijan_saved_prompts", JSON.stringify(updated));
            renderSavedPrompts();
          } else {
            promptInput.value = text;
            localStorage.setItem("srijan_last_prompt", text);
          }
        });
        savedChipsContainer.appendChild(chip);
      });
    }
    renderSavedPrompts();

    savePromptBtn.addEventListener("click", () => {
      const val = promptInput.value.trim();
      if (!val) return;
      const list = getSavedPrompts();
      if (!list.includes(val)) {
        list.unshift(val);
        localStorage.setItem("srijan_saved_prompts", JSON.stringify(list));
        renderSavedPrompts();
      }
    });

    // Tab Switching
    tabBtns.forEach(btn => {
      btn.addEventListener("click", () => {
        tabBtns.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentMode = btn.dataset.mode;
        imageSection.style.display = currentMode === "i2v" ? "block" : "none";
        modeBadge.textContent = currentMode === "i2v" ? "Image-to-Video" : "Text-to-Video";
      });
    });

    // Image Upload Handling
    dropzone.addEventListener("click", () => imageInput.click());
    imageInput.addEventListener("change", () => {
      const file = imageInput.files[0];
      if (file) {
        imgPreview.src = URL.createObjectURL(file);
        imgPreview.style.display = "block";
        dropText.textContent = file.name;
      }
    });

    function setStageState({ loading = false, status = "", isError = false, videoUrl = null }) {
      loader.style.display = loading ? "block" : "none";
      placeholderState.style.display = (!loading && !videoUrl && !status) ? "block" : "none";
      statusText.textContent = status;
      statusText.className = isError ? "status-text error" : "status-text";

      if (videoUrl) {
        outputVideo.src = videoUrl;
        outputVideo.style.display = "block";
        downloadLink.href = videoUrl;
        stageActions.style.display = "flex";
      } else {
        outputVideo.style.display = "none";
        stageActions.style.display = "none";
      }
    }

    // Video Generation Execution
    generateBtn.addEventListener("click", async () => {
      const token = tokenInput.value.trim();
      const spaceId = spaceInput.value.trim() || "Lightricks/ltx-video-distilled";
      const file = imageInput.files[0];
      const prompt = promptInput.value.trim();

      if (!token) {
        settingsBar.classList.add("open");
        return setStageState({ status: "Please add your Hugging Face token at the top.", isError: true });
      }
      if (currentMode === "i2v" && !file) {
        return setStageState({ status: "Please upload an image first.", isError: true });
      }
      if (!prompt) {
        return setStageState({ status: "Please enter or select a prompt.", isError: true });
      }

      generateBtn.disabled = true;
      setStageState({ loading: true, status: "Connecting to ZeroGPU engine..." });

      try {
        const client = await Client.connect(spaceId, { hf_token: token });
        const apiInfo = await client.view_api();
        const namedEndpoints = apiInfo.named_endpoints || {};
        const endpointKeys = Object.keys(namedEndpoints);

        // Filter only endpoints that return a Video
        const videoEndpoints = endpointKeys.filter(ep => {
          const returns = namedEndpoints[ep]?.returns || [];
          return returns.some(r =>
            r.component?.toLowerCase().includes("video") ||
            r.label?.toLowerCase().includes("video") ||
            r.type?.toLowerCase().includes("file")
          );
        });

        const candidates = videoEndpoints.length > 0 ? videoEndpoints : endpointKeys;
        const modeKeyword = currentMode === "i2v" ? "image" : "text";

        const targetEp = candidates.find(ep => ep.toLowerCase().includes(modeKeyword)) || candidates[0];
        if (!targetEp) throw new Error("No video generation endpoint found on this Space.");

        const paramsList = namedEndpoints[targetEp]?.parameters || [];
        const payload = {};

        paramsList.forEach(p => {
          const name = p.parameter_name;
          const lower = name.toLowerCase();

          if (lower.includes("image") || lower.includes("img") || p.component?.toLowerCase().includes("image")) {
            payload[name] = currentMode === "i2v" ? file : null;
          } else if (lower.includes("prompt") && !lower.includes("negative")) {
            payload[name] = prompt;
          } else if (lower === "mode") {
            payload[name] = currentMode === "i2v" ? "image-to-video" : "text-to-video";
          } else if (p.parameter_has_default) {
            payload[name] = p.parameter_default;
          }
        });

        setStageState({ loading: true, status: "Rendering video on ZeroGPU (takes ~25–45 seconds)..." });

        const result = await client.predict(targetEp, payload);

        let videoUrl = null;
        const items = Array.isArray(result.data) ? result.data : [result.data];
        for (const item of items) {
          if (item?.video?.url) { videoUrl = item.video.url; break; }
          if (item?.url && (item.url.endsWith(".mp4") || item.url.includes("video") || item.url.includes("file="))) {
            videoUrl = item.url; break;
          }
          if (typeof item === "string" && item.startsWith("http")) {
            videoUrl = item; break;
          }
        }

        if (!videoUrl) throw new Error("Video generated but URL could not be extracted.");

        setStageState({ loading: false, status: "Render complete", videoUrl });
      } catch (err) {
        setStageState({ loading: false, status: err.message, isError: true });
      } finally {
        generateBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
